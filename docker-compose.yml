# problems with mysql connect

x-common-variables: &common-variables
  MYSQL_USER: fullstack
  MYSQL_PASSWORD: 1234
  MYSQL_DATABASE: case
  MYSQL_PORT: 3306
  MYSQL_HOST_IP: mysql-db
  SERVER_PORT: 3003
  JWT_SECRET_KEY: asf4ASGiuh8xc735unjk

version: "3.8"
services:
  nginx:
    restart: always
    build:
      context: ./nginx
    ports:
      - "3009:3009"
    depends_on:
      - backend
      - frontend
    networks:
      - public
      - private


  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
        - private

  mysql-db:
    image: mariadb:10.3
    container_name: fullstack-case
    environment:
      <<: *common-variables
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3307"
    networks:
      - private
      - public
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend:
    build:
      args:
        - NODE_ENV=production
      context: backend
    command: sh -c "npm run migrate && npm start"
    restart: on-failure
    container_name: fullstack_case_backend
    environment:
      <<: *common-variables
      NODE_ENV: production
    ports:
      - "3003:3003"
    volumes:
      - ./backend/src:/code/src:ro
      - ./backend/migrations:/code/migrations:ro
      - ./backend/scripts:/code/scripts:ro
      - ./backend/package.json:/code/package.json
      - ./backend/package-lock.json:/code/package-lock.json
      - ./frontend/public:/frontend/public:ro
      - back-notused:/opt/app/node_modules
    networks:
      - private
    depends_on:
      redis:
        condition: service_started
      mysql-db:
        condition: service_healthy

  frontend:
    stdin_open: true
    restart: unless-stopped
    container_name: fullstack_case_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3033:3033
    volumes:
      - '/app/node_modules'
      - .:/app
    networks:
      - public
    depends_on:
      - backend

networks:
  public:
      driver: bridge
  private:

volumes:
  back-notused:

