x-database: &database
  MYSQL_DATABASE: case
  MYSQL_USER: fullstack
  MYSQL_PASSWORD: "1234"

services:
  nginx:
    restart: always
    build:
      context: ./nginx
    ports:
      - "3009:3009"
    depends_on:
      - backend
      - frontend
    networks:
      - public
      - private

  redis:
    image: redis:alpine
    container_name: redis
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - private

  mysql-db:
    image: mysql:8.0
    container_name: fullstack-case
    environment:
      <<: *database
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend:
    build:
      context: backend
    command: sh -c "npm run migrate && npm start"
    restart: on-failure
    container_name: fullstack_case_backend
    environment:
      NODE_ENV: production
      SERVER_PORT: 3003
      MYSQL_HOST_IP: mysql-db
      DB_PORT: 3306
      PROD_DB_NAME: case
      PROD_DB_USER: fullstack
      PROD_DB_PASS: "1234"
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: asf4ASGiuh8xc735unjk
      CLIENT_ORIGIN: http://localhost:3009
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - "127.0.0.1:3003:3003"
    volumes:
      - ./frontend/public:/frontend/public:ro
    networks:
      - private
    depends_on:
      redis:
        condition: service_started
      mysql-db:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    container_name: fullstack_case_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3033:3033"
    networks:
      - public
    depends_on:
      - backend

networks:
  public:
    driver: bridge
  private:

volumes:
  mysql-data:
